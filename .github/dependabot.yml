version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the Playwright driver in nixpkgs; update both together.
      - dependency-name: "@playwright/test"
      # Typed for the Node.js major the project runs on; see the node image below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Node.js major is shared by the image, CI, the Nix package, esbuild's
      # target and package.json engines; move them together by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
