name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `proxdesk version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Container, NixOS module, Release tarball, From source]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and doctor output
      description: Output of `proxdesk doctor` and relevant server logs. Remove tokens and hostnames you do not want to share.
      render: text
